{% extends 'base.html' %}
{% block content %}

<h2>Live Attendance Marksheet</h2>

<img src="{{ url_for('static', filename='qr_codes/' + qr_token + '.png') }}" width="250">

<div class="mt-3">
    <a href="/end_session/{{ session_id }}" class="btn btn-danger">
        ⛔ End Session
    </a>

    <a href="/export_excel/{{ session_id }}" class="btn btn-success">
        ⬇️ Export to Excel
    </a>
</div>

<table class="table table-bordered mt-4">
    <tr>
        <th>Admission</th>
        <th>Name</th>
        <th>Course</th>
        <th>Scan Time</th>
    </tr>

    {% for r in records %}
    <tr>
        <td>{{ r.admission }}</td>
        <td>{{ r.name }}</td>
        <td>{{ r.course }}</td>
        <td>{{ r.scan_time }}</td>
    </tr>
    {% endfor %}
</table>

<script>
    setTimeout(function(){
       window.location.reload(1);
    }, 3000);
</script>

{% endblock %}
